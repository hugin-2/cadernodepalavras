<title>Caderno de palavras</title>
<style>
:root{--bg:#f3f6fb;--surface:#ffffff;--ink:#14213d;--muted:#5b6882;--line:#d6deec;--mark:#ffe36e;--accent:#2a4bd7;--onaccent:#ffffff;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1626;--surface:#18223a;--ink:#e8edf8;--muted:#98a5c2;--line:#2b3957;--mark:#6b5a0c;--accent:#8fa6ff;--onaccent:#0f1626;--danger:#ff9a93}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1626;--surface:#18223a;--ink:#e8edf8;--muted:#98a5c2;--line:#2b3957;--mark:#6b5a0c;--accent:#8fa6ff;--onaccent:#0f1626;--danger:#ff9a93}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Iowan Old Style",serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:28px;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px;font-family:system-ui,sans-serif;font-size:14px}
form,.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
label{display:block;font:600 13px system-ui,sans-serif;color:var(--muted);margin:10px 0 4px}
label:first-child{margin-top:0}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:72px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:600 15px system-ui,sans-serif;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--onaccent)}
button.ghost{background:transparent;color:var(--muted);padding:6px 8px;font-weight:500;font-size:14px}
button.ghost.del{color:var(--danger)}
.row{display:flex;gap:8px;margin-top:12px;align-items:center}
.search{margin:0 0 16px}
.letter{font:700 13px system-ui,sans-serif;color:var(--accent);margin:20px 0 6px}
.item{margin-bottom:10px}
.word{font-size:21px;font-weight:700;background:linear-gradient(transparent 58%,var(--mark) 58%);display:inline}
.mean{margin:8px 0 0}
.ex{margin:6px 0 0;color:var(--muted);font-style:italic}
.acts{display:flex;justify-content:flex-end;margin-top:6px}
.pic{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin:0 0 10px}
#prev{margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:28px 8px;font-family:system-ui,sans-serif}
</style>
</head>
<body>
<main>
<h1>Caderno de palavras</h1>
<p class="sub" id="count"></p>

<input class="search" id="q" type="search" placeholder="Buscar por palavra, significado ou exemplo" aria-label="Buscar">

<form id="f">
  <label for="w">Palavra</label>
  <input id="w" required autocomplete="off">
  <label for="m">Significado</label>
  <textarea id="m" required></textarea>
  <label for="e">Exemplo de uso (opcional)</label>
  <input id="e" autocomplete="off">
  <label for="img">Imagem (opcional)</label>
  <input id="img" type="file" accept="image/*">
  <div id="prev"></div>
  <div class="row"><button type="submit" id="save">Salvar palavra</button><button type="button" class="ghost" id="cancel" hidden>Cancelar edição</button></div>
</form>


<div id="list"></div>
</main>

<script>
var KEY="caderno-palavras", words=[], editId=null, curImg="";
function load(){try{var r=localStorage.getItem(KEY);words=r?JSON.parse(r):[]}catch(e){words=[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(words))}catch(e){}}
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var q=norm(document.getElementById("q").value.trim());
  var n=words.length;
  document.getElementById("count").textContent=n===0?"Nenhuma palavra ainda":n+(n===1?" palavra salva":" palavras salvas");
  var list=words.filter(function(x){return !q||norm(x.w).indexOf(q)>-1||norm(x.m).indexOf(q)>-1||norm(x.e).indexOf(q)>-1})
    .sort(function(a,b){return a.w.localeCompare(b.w,"pt-BR")});
  if(q&&n){document.getElementById("count").textContent=list.length+" de "+n+(n===1?" palavra":" palavras")}
  var el=document.getElementById("list");
  if(!list.length){el.innerHTML='<div class="empty">'+(n?"Nada encontrado para essa busca.":"Adicione sua primeira palavra acima.")+'</div>';return}
  var html="",last="";
  list.forEach(function(x){
    var L=x.w.charAt(0).toUpperCase();
    if(L!==last){html+='<div class="letter">'+esc(L)+'</div>';last=L}
    html+='<div class="item">'+(x.i?'<img class="pic" src="'+x.i+'" alt="">':'')+'<span class="word">'+esc(x.w)+'</span><p class="mean">'+esc(x.m)+'</p>'+
      (x.e?'<p class="ex">“'+esc(x.e)+'”</p>':'')+
      '<div class="acts"><button class="ghost" data-a="edit" data-id="'+x.id+'">Editar</button><button class="ghost del" data-a="del" data-id="'+x.id+'">Excluir</button></div></div>';
  });
  el.innerHTML=html;
}
function showPrev(){var p=document.getElementById("prev");p.innerHTML=curImg?'<img class="pic" src="'+curImg+'" alt=""><button type="button" class="ghost" id="rmimg">Remover imagem</button>':"";var r=document.getElementById("rmimg");if(r)r.onclick=function(){curImg="";document.getElementById("img").value="";showPrev()}}
function reset(){editId=null;curImg="";document.getElementById("f").reset();showPrev();document.getElementById("save").textContent="Salvar palavra";document.getElementById("cancel").hidden=true}
document.getElementById("f").addEventListener("submit",function(ev){
  ev.preventDefault();
  var w=document.getElementById("w").value.trim(),m=document.getElementById("m").value.trim(),e=document.getElementById("e").value.trim();
  if(!w||!m)return;
  if(editId){words=words.map(function(x){return x.id===editId?{id:x.id,w:w,m:m,e:e,i:curImg}:x})}
  else{words.push({id:String(Date.now()),w:w,m:m,e:e,i:curImg})}
  persist();reset();render();
});
document.getElementById("cancel").addEventListener("click",reset);
document.getElementById("q").addEventListener("input",render);
document.getElementById("list").addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  var id=b.getAttribute("data-id");
  if(b.getAttribute("data-a")==="del"){
    if(confirm("Excluir esta palavra?")){words=words.filter(function(x){return x.id!==id});persist();render()}
  }else{
    var x=words.filter(function(y){return y.id===id})[0];if(!x)return;
    editId=id;document.getElementById("w").value=x.w;document.getElementById("m").value=x.m;document.getElementById("e").value=x.e||"";curImg=x.i||"";showPrev();
    document.getElementById("save").textContent="Atualizar palavra";document.getElementById("cancel").hidden=false;
    window.scrollTo({top:0,behavior:"smooth"});document.getElementById("w").focus();
  }
});
document.getElementById("img").addEventListener("change",function(ev){var f=ev.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,480/Math.max(im.width,im.height));var c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);curImg=c.toDataURL("image/jpeg",0.7);showPrev()};im.src=rd.result};rd.readAsDataURL(f)});
load();render();
</script>
</body>
</html>
